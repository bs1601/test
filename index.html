' = '+a*b);case 10:return Q('□ + '+b+' = '+(a+b)+'\nמה הנעלם?',a,[a+b,a-b,a+1],'מחסרים '+b+' מהסכום');case 11:return Q('□ × '+b+' = '+a*b+'\nמה הנעלם?',a,[a*b,a+b,a-1],'מחלקים ב־'+b);case 12:return Q('איזה מספר גדול מ־'+n+'?',n+5,[n,n-1,n-5],'גדול מ־'+n+' פירושו מספר גבוה יותר');case 13:return Q('מלבן: אורך '+a+' ס״מ, רוחב '+b+' ס״מ. מה ההיקף?',2*(a+b),[a*b,a+b,2*a+b],'מחברים את ארבע הצלעות','<span class="shape"></span>');case 14:return Q('מלבן: אורך '+a+' ס״מ, רוחב '+b+' ס״מ. מה השטח?',a*b,[2*(a+b),a+b,a*b+2],'שטח = אורך כפול רוחב','<span class="shape"></span>');case 15:k=P([3,4,5,6]);return Q('כמה צלעות יש ל'+({3:'משולש',4:'מרובע',5:'מחומש',6:'משושה'}[k])+'?',k,[k-1,k+1,k+2],'מספר הצלעות הוא '+k);case 16:return Q('קו מתחיל בסימון 0 בסרגל ומסתיים בסימון '+a+'. מה אורכו בס״מ?',a,[a+1,a-1,a+2],'המרחק מ־0 עד '+a+' הוא '+a+' ס״מ','📏');case 17:a=R(1,12);b=P([0,15,30,45]);return Q('מה השעה בשעון?',a+':'+String(b).padStart(2,'0'),[a+':'+String((b+15)%60).padStart(2,'0'),(a%12+1)+':'+String(b).padStart(2,'0'),a+':'+String((b+30)%60).padStart(2,'0')],'מחוג הדקות מציין '+b+' דקות. מחוג השעות '+(b===0?'על '+a:'בין '+a+' ל־'+(a%12+1)),'<div class="clock"><i class="hand" style="height:40px;transform:rotate('+(a*30+b/2)+'deg)"></i><i class="hand" style="height:60px;background:orange;transform:rotate('+(b*6)+'deg)"></i><b style="position:absolute;top:0;left:44%;font-size:16px">12</b><b style="position:absolute;right:5px;top:43%;font-size:16px">3</b><b style="position:absolute;bottom:0;left:46%;font-size:16px">6</b><b style="position:absolute;left:5px;top:43%;font-size:16px">9</b></div>');case 18:a=R(2,7);b=R(2,7);n=R(2,7);return Q('כמה פירות בסך הכול בדיאגרמה?',a+b+n,[a+b,a+b+n+2,a+b+n-1],'מחברים את שלוש העמודות',chart([a,b,n]));case 19:a=R(3,9);b=R(2,8);n=R(2,8);return Q('כמה תפוחים בדיאגרמה?',a,[a+1,a+2,a+3],'קוראים את גובה עמודת התפוחים',chart([a,b,n]));case 20:a=R(16,30);b=R(4,15);return Q('לנועה '+a+' מדבקות. נתנה '+b+'. כמה נשארו?',a-b,[a+b,a-b+2,a-b-1],'מחסרים '+b+' מ־'+a) Id('vbtn'),s=document.getElementById('sbtn');if(v)v.textContent=voiceOn?'🔊 קריינות פעילה':'🔇 קריינות כבויה';if(s)s.textContent=soundOn?'🎵 צלילים פעילים':'🔕 צלילים כבויים'}function voiceControls(){return '<div class="voicebar"><button id="vbtn" onclick="toggleVoice()">'+(voiceOn?'🔊 קריינות פעילה':'🔇 קריינות כבויה')+'</button><button id="sbtn" onclick="toggleSound()">'+(soundOn?'🎵 צלילים פעילים':'🔕 צלילים כבויים')+'</button><button onclick="speakQuestion()">🗣️ הקרא שאלה</button></div>'}const lessons=[

render=function(){g.q=make(g.ids[g.idx]);g.answered=false;let z=g.q;app.innerHTML='<button class="back" onclick="home()">🏠 חזרה לעולמות</button><div class="panel"><h2>'+ (g.exam?'🏆 מבחן מסכם':g.review?'💪 האימון האישי שלי':worlds[g.w][0]+' '+worlds[g.w][1])+'</h2>'+voiceControls()+'<div class="bar"><i style="width:'+(g.idx/g.ids.length*100)+'%"></i></div><p>שאלה '+(g.idx+1)+' מתוך '+g.ids.length+(g.exam?'':' | ⭐ '+g.score)+'</p><div class="question">'+z.t+'</div><div class="visual">'+z.v+'</div>'+(z.build?'<div class="chart" id="builder">'+z.build.map((v,i)=>'<div class="col"><i id="column'+i+'" style="height:0px"></i><label>'+['🍎 תפוחים','🍌 בננות','🍇 ענבים'][i]+'<input aria-label="'+['תפוחים','בננות','ענבים'][i]+'" type="range" min="0" max="10" value="0" oninput="updateColumn('+i+',this.value)"><output id="value'+i+'">0</output></label></div>').join('')+'</div><button class="primary" onclick="answerBuild()">בדיקת הדיאגרמה</button>':'<div class="answers">'+z.opts.map((o,i)=>'<button class="answer" id="a'+i+'" onclick="answer('+i+')">'+o+'</button>').join('')+'</div>')+'<div id="feedback" aria-live="polite"></div><div id="next"></div></div>';window.scrollTo(0,0)};
function updateColumn(i,v){document.getElementById('column'+i).style.height=(v*12)+'px';document.getElementById('value'+i).textContent=v}
function answerBuild(){if(g.answered)return;let vals=[...document.querySelectorAll('#builder input')].map(x=>x.value).join(',');complete(vals===g.q.a,vals);document.querySelectorAll('#builder input').forEach(x=>x.disabled=true)}
answer=function(i){if(g.answered)return;let z=g.q;complete(z.opts[i]===z.a,z.opts[i]);document.querySelectorAll('.answer').forEach((el,j)=>{el.disabled=true;if(g.exam){if(j===i)el.classList.add('selected')}else{if(z.opts[j]===z.a)el.classList.add('right');else if(j===i)el.classList.add('wrong')}})};
function complete(ok,given){g.answered=true;let id=g.ids[g.idx],z=g.q;if(ok){g.score++;weaknesses[id]=Math.max(0,(weaknesses[id]||0)-1)}else{weaknesses[id]=(weaknesses[id]||0)+1;g.mistakes.push({id,question:plain(z.t),given,correct:z.a,explanation:z.e})}persist();if(!g.exam){fx(ok);if(ok)confetti();document.getElementById('feedback').innerHTML='<div class="feedback"><b>'+(ok?'🎉 כל הכבוד!':'💡 נלמד וננסה שוב')+'</b><p>'+(ok?'':'התשובה הנכונה: '+z.a+'. ')+z.e+'</p><button class="back" onclick="speak(g.q.e)">🔊 שמע הסבר</button></div>'}document.getElementById('next').innerHTML='<button class="primary" onclick="next()">'+(g.idx===g.ids.length-1?'🏁 סיום':'לשאלה הבאה ➡')+'</button>'}
next=function(){if(++g.idx<g.ids.length){render();return}let pct=Math.round(g.score/g.ids.length*100);if(!g.exam&&!g.review)scores[g.w]=Math.max(scores[g.w]||0,g.score);persist();confetti();app.innerHTML='<div class="panel" style="text-align:center"><div style="font-size:70px">'+(pct>=80?'🏆':'🌟')+'</div><h1>'+(g.exam?'סיימת את המבחן!':'סיימת את המשימה!')+'</h1><h2>'+(g.exam?pct+' / 100':g.score+' / '+g.ids.length+' תשובות נכונות')+'</h2><p>'+g.score+' תשובות נכונות מתוך '+g.ids.length+'</p><p>'+(pct>=80?'איזה הישג! ממשיכים לצמוח.':'כל ניסיון מחזק אותנו. נלמד מהטעויות ונתרגל שוב.')+'</p><button class="primary" onclick="startReview()">💪 תרגול לפי הטעויות שלי</button><button class="back" onclick="home()">🏠 חזרה לעולמות</button></div>'+(g.mistakes.length?'<div class="panel"><h2>בואו נבין את הטעויות</h2>'+g.mistakes.map(m=>'<div class="feedback"><b>'+m.question+'</b><p>התשובה שלך: '+m.given+' · התשובה הנכונה: '+m.correct+'</p><p>'+m.explanation+'</p></div>').join('')+'</div>':'');window.scrollTo(0,0)};
const demos=[
{title:'חיבור עם המרה',board:['  27\n+ 38\n────','  ¹ \n  27\n+ 38\n────\n   5','  ¹ \n  27\n+ 38\n────\n  65'],steps:['מסדרים: אחדות מתחת לאחדות ועשרות מתחת לעשרות. מתחילים מימין.','באחדות: 7 ועוד 8 שווה 15. כותבים 5 ומעבירים עשרת אחת למעלה.','בעשרות: 2 ועוד 3 ועוד 1 שהעברנו שווה 6. התוצאה 65. בודקים: 65 פחות 38 שווה 27.']},
{title:'חיסור עם פריטה',board:['  52\n− 28\n────',' 4 12\n  52\n− 28\n────\n   4',' 4 12\n  52\n− 28\n────\n  24'],steps:['מסדרים 52 מעל 28. באחדות צריך להחסיר 8 מ־2. נפרוט עשרת אחת.','5 עשרות הופכות ל־4 עשרות, והאחדות הופכות ל־12. עכשיו 12 פחות 8 שווה 4.','בעשרות: 4 פחות 2 שווה 2. התוצאה 24. בודקים: 24 ועוד 28 שווה 52.']},
{title:'כפל במאונך',board:['  23\n×  4\n────','  ¹ \n  23\n×  4\n────\n   2','  ¹ \n  23\n×  4\n────\n  92'],steps:['מסדרים 23 מעל 4. מתחילים בספרת האחדות.','4 כפול 3 שווה 12. כותבים 2 באחדות וזוכרים עשרת אחת.','4 כפול 2 עשרות שווה 8 עשרות. מוסיפים את העשרת שזכרנו: 9 עשרות. התוצאה 92. אפשר לבדוק: 20 כפול 4 ועוד 3 כפול 4 שווה 92.']},
{title:'חילוק ארוך',board:['    __\n4 ) 96','    2_\n4 ) 96\n   −8\n    ─\n    1','    2_\n4 ) 96\n   −8\n    ─\n    16','    24\n4 ) 96\n   −8\n    ─\n    16\n   −16\n    ──\n     0'],steps:['נחשב 96 חלקי 4. מתחילים בעשרות: כמה פעמים 4 נכנס ב־9?','פעמיים. כותבים 2 למעלה. 2 כפול 4 שווה 8. מחסרים 9 פחות 8 ונשארת עשרת אחת.','מורידים את ספרת האחדות 6 לצד השארית. יש עכשיו 16 אחדות.','16 חלקי 4 שווה 4. כותבים 4 למעלה. מחסרים 16 ונשאר 0. התוצאה 24. בודקים: 24 כפול 4 שווה 96.']}
];let demoState={id:0,step:0};
function showDemo(id,step=0){demoState={id,step};let d=demos[id];app.innerHTML='<button class="back" onclick="lessonsHome()">📚 כל השיטות</button><div class="panel"><h2>'+d.title+' — צעד אחר צעד</h2><p>צעד '+(step+1)+' מתוך '+d.steps.length+'</p><div class="steps">'+d.steps.map((_,i)=>'<i class="'+(i<=step?'active':'')+'"></i>').join('')+'</div><div class="board"><pre class="vertical">'+d.board[step]+'</pre><div class="step">'+d.steps[step]+'</div></div><button class="primary" onclick="speak(demos[demoState.id].steps[demoState.step])">🔊 שמע את הצעד</button><div class="formrow" style="margin-top:15px"><button class="back" onclick="showDemo('+id+','+Math.max(0,step-1)+')" '+(step===0?'disabled':'')+'>הצעד הקודם</button><button class="back" onclick="'+(step<d.steps.length-1?'showDemo('+id+','+(step+1)+')':'start(2)')+'">'+(step<d.steps.length-1?'הצעד הבא ➡':'🎮 לתרגול')+'</button></div></div>';window.scrollTo(0,0)}
const oldLessonsHome=lessonsHome;
lessonsHome=function(){oldLessonsHome();app.insertAdjacentHTML('beforeend','<h2>🎬 מדגימים במאונך</h2><div class="grid">'+demos.map((d,i)=>'<button class="tile" onclick="showDemo('+i+')"><span class="emoji">'+['➕','➖','✖️','➗'][i]+'</span><b>'+d.title+'</b><small>מתקדמים צעד אחד בכל לחיצה</small></button>').join('')+'</div>')};
const oldOpenLesson=openLesson;
openLesson=function(i,j){oldOpenLesson(i,j);const map={1:2,2:2,3:2,4:3,5:4,6:5};let btn=[...app.querySelectorAll('.primary')].at(-1);if(j===lessons[i][2].length-1)btn.setAttribute('onclick','start('+(map[i]??i)+')');let feedback=app.querySelector('.feedback');if(feedback&&[1,2,3].includes(i)){feedback.style.direction='ltr';feedback.style.fontFamily='monospace'}if(i===1){app.insertAdjacentHTML('beforeend','<button class="primary" onclick="showDemo('+j+')">🎬 הדגמה צעד אחר צעד</button>')}if(i===2&&j===2)app.insertAdjacentHTML('beforeend','<button class="primary" onclick="showDemo(2)">🎬 כפל במאונך צעד אחר צעד</button>');if(i===3&&j===2)app.insertAdjacentHTML('beforeend','<button class="primary" onclick="showDemo(3)">🎬 חילוק ארוך עם שארית ביניים</button>')};
</script>
<style>.placeboard{direction:ltr;border-collapse:collapse;background:white;border-radius:14px;margin:auto;font:700 29px/1.5 monospace;text-align:center}.placeboard td{min-width:48px;padding:2px 7px}.placeboard th{font:13px Arial;color:#615c78;padding:8px}.placeboard tr:last-child td{border-top:3px solid #5b43ad}.placeboard .carry td{color:#c16400;font-size:20px}.lessoncheck{background:#e8f7ff;padding:16px;border-radius:14px;margin-top:15px}.lessoncheck input{width:110px;padding:10px;border-radius:10px;border:2px solid #9280ce;font-size:22px}.questionnote{font-size:15px;color:#57536b;line-height:1.6}</style>
<script>
const originalRender=render;
render=function(){originalRender();g.selected=null;g.pending=null;let submit=document.createElement('div');submit.id='submit-area';submit.innerHTML='<p class="questionnote">אפשר לשנות את הבחירה עד המעבר לשאלה הבאה.</p>'+(g.q.build?'':'<button class="primary" id="check-answer" onclick="checkAnswer()" disabled>'+ (g.exam?'אישור הבחירה':'בדיקת התשובה')+'</button>');app.insertAdjacentHTML('beforeend',submit.outerHTML)};
answer=function(i){g.selected=i;g.answered=false;g.pending=null;document.querySelectorAll('.answer').forEach((el,j)=>{el.disabled=false;el.classList.remove('right','wrong');el.classList.toggle('selected',j===i);el.setAttribute('aria-pressed',j===i?'true':'false')});document.getElementById('feedback').innerHTML='';document.getElementById('next').innerHTML='';document.getElementById('check-answer').disabled=false};
function checkAnswer(){if(g.selected===null)return;let given=g.q.opts[g.selected];complete(given===g.q.a,given)}
answerBuild=function(){let vals=[...document.querySelectorAll('#builder input')].map(x=>x.value).join(',');complete(vals===g.q.a,vals)};
const originalUpdateColumn=updateColumn;
updateColumn=function(i,v){originalUpdateColumn(i,v);g.answered=false;g.pending=null;document.getElementById('feedback').innerHTML='';document.getElementById('next').innerHTML=''};
complete=function(ok,given){g.answered=true;g.pending={ok,given};if(!g.exam){fx(ok);if(ok)confetti();document.getElementById('feedback').innerHTML='<div class="feedback"><b>'+(ok?'🎉 כל הכבוד!':'💡 נלמד וננסה שוב')+'</b><p>'+(ok?'':'התשובה הנכונה: '+g.q.a+'. ')+g.q.e+'</p><button class="back" onclick="speak(g.q.e)">🔊 שמע הסבר</button><p class="caption">אפשר לבחור תשובה אחרת ולבדוק שוב. הניקוד נקבע במעבר לשאלה הבאה.</p></div>'}document.getElementById('next').innerHTML='<button class="primary" onclick="next()">'+(g.idx===g.ids.length-1?'🏁 סיום':'לשאלה הבאה ➡')+'</button>'};
const originalNext=next;
next=function(){if(!g.answered||!g.pending)return;let id=g.ids[g.idx],z=g.q;if(g.pending.ok){g.score++;weaknesses[id]=Math.max(0,(weaknesses[id]||0)-1)}else{weaknesses[id]=(weaknesses[id]||0)+1;g.mistakes.push({id,question:plain(z.t),given:g.pending.given,correct:z.a,explanation:z.e})}g.pending=null;persist();originalNext()};
function placeBoard(id,step){if(id===3)return '<pre class="vertical">'+demos[id].board[step]+'</pre>';let rows=[];let a=id===0?'27':id===1?'52':'23',b=id===0?'38':id===1?'28':' 4';if(step>0)rows.push(id===1?'<tr class="carry"><td></td><td>4</td><td>12</td></tr>':'<tr class="carry"><td></td><td>1</td><td></td></tr>');rows.push('<tr><td></td><td>'+(id===1&&step>0?'<s>5</s>':a[0])+'</td><td>'+(id===1&&step>0?'<s>2</s>':a[1])+'</td></tr>');rows.push('<tr><td>'+['+','−','×'][id]+'</td><td>'+b[0]+'</td><td>'+b[1]+'</td></tr>');let result=step===0?'  ':step===1?[' 5',' 4',' 2'][id]:['65','24','92'][id];rows.push('<tr><td></td><td>'+result[0]+'</td><td>'+result[1]+'</td></tr>');return '<table class="placeboard" aria-label="תרגיל במאונך"><thead><tr><th></th><th>עשרות</th><th>אחדות</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>'}
const checkpoints=[[['כמה זה 7 + 8?',15],['איזו ספרה נכתוב באחדות של 15?',5],['כמה עשרות יש בתוצאה: 2 + 3 + 1?',6]],[['כמה אחדות נקבל אחרי פריטת עשרת אחת לצד 2 האחדות?',12],['כמה זה 12 − 8?',4],['כמה זה 4 − 2?',2]],[['כמה זה 4 × 3?',12],['כמה עשרות צריך להעביר מתוך 12?',1],['מה התוצאה של 23 × 4?',92]],[['כמה פעמים 4 נכנס ב־9 בלי לעבור אותו?',2],['מה נשאר מ־9 אחרי שמחסרים 8?',1],['כמה זה 16 ÷ 4?',4],['מה התוצאה של 96 ÷ 4?',24]]];
showDemo=function(id,step=0){demoState={id,step};let d=demos[id],q=checkpoints[id][step];app.innerHTML='<button class="back" onclick="lessonsHome()">📚 כל השיטות</button><div class="panel"><h2>'+d.title+' — צעד אחר צעד</h2>'+(id===3?'<p class="caption">שיטה נוספת להבנת חילוק. מסמך המורה אינו מציין שחייבים לפתור בחילוק ארוך.</p>':'')+'<p>צעד '+(step+1)+' מתוך '+d.steps.length+'</p><div class="steps">'+d.steps.map((_,i)=>'<i class="'+(i<=step?'active':'')+'"></i>').join('')+'</div><div class="board">'+placeBoard(id,step)+'<div class="step">'+d.steps[step]+'</div></div><button class="primary" onclick="speak(demos[demoState.id].steps[demoState.step])">🔊 שמע את הצעד</button><div class="lessoncheck"><label for="step-answer">עכשיו תורך: <bdi dir="auto">'+q[0]+'</bdi></label><div class="formrow"><input id="step-answer" type="number" inputmode="numeric" autocomplete="off" oninput="resetStepCheck()"><button class="back" onclick="checkStep()">בודקים יחד</button></div><p id="step-feedback" aria-live="polite"></p></div><div class="formrow" style="margin-top:15px"><button class="back" onclick="showDemo('+id+','+Math.max(0,step-1)+')" '+(step===0?'disabled':'')+'>הצעד הקודם</button><button class="back" id="step-next" disabled onclick="'+(step<d.steps.length-1?'showDemo('+id+','+(step+1)+')':'startOperation('+id+')')+'">'+(step<d.steps.length-1?'הצעד הבא ➡':'🎮 לתרגול של השיטה')+'</button></div></div>';window.scrollTo(0,0)};
function resetStepCheck(){document.getElementById('step-next').disabled=true;document.getElementById('step-feedback').textContent=''}
function checkStep(){let input=document.getElementById('step-answer'),expected=checkpoints[demoState.id][demoState.step][1],ok=input.value.trim()!==''&&Number(input.value)===expected;document.getElementById('step-feedback').textContent=ok?'מצוין! הבנת את הצעד. אפשר להמשיך.':'ננסה שוב. קראו או שמעו את ההסבר מעל השאלה.';document.getElementById('step-next').disabled=!ok;fx(ok)}
function startOperation(id){g={w:2,exam:false,idx:0,score:0,ids:Array(10).fill([6,7,8,9][id]),mistakes:[]};render()}
// Add a second explanation that makes the units explicit, with no ambiguous carry placement.
lessons[1][2][0][2]='27 + 38 = 65';lessons[1][2][1][2]='52 − 28 = 24';lessons[2][2][2][2]='23 × 4 = 92';
lessons[3][2][2][0]='חילוק במאונך — שיטה נוספת';
lessons[2][2][0][1]='4 כפול 3 פירושו ארבע קבוצות של שלושה. בכל קבוצה 3 תפוחים. מחברים 3 ועוד 3 ועוד 3 ועוד 3 ומקבלים 12.';
// The geometry examples use units consistently.
lessons[5][2][1][1]='שטח הוא מספר ריבועי היחידה שמכסים את הצורה. במלבן שאורכו 6 סנטימטרים ורוחבו 3 סנטימטרים יש 18 ריבועים של סנטימטר על סנטימטר. השטח הוא 18 סנטימטרים רבועים.';
const auditedMake=make;
make=function(id){let q=auditedMake(id);if(id===13||id===22)q.e+=' היחידה של היקף היא סנטימטרים.';if(id===14)q.e+=' היחידה של שטח היא סנטימטרים רבועים, כי סופרים ריבועי יחידה.';if(id===8){let ns=plain(q.t).match(/\d+/g).map(Number);q.e=ns[0]+' קבוצות של '+ns[1]+': '+Array(ns[0]).fill(ns[1]).join(' + ')+' = '+q.a+'. אפשר גם לפרק את מספר הקבוצות לעשרות ולאחדות.'}return q};
home();
